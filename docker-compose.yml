services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Without a key the API still serves the pre-built data/facts.db read-only;
      # extraction of new PDFs requires one.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      GEMINI_RPM: ${GEMINI_RPM:-10}
      FKL_DB: /app/data/facts.db
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      # Resolved by the browser, so it points at the host-published backend port.
      VITE_API_BASE: http://localhost:8000
    depends_on:
      - backend
